<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri — Bakpia.id</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="brand">🥮 Bakpia.id</a>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="tentang.html">Tentang Kami</a>
        <a href="produk.html">Produk</a>
        <a href="galeri.html" class="aktif">Galeri</a>
        <a href="index.html#kontak-singkat">Kontak Singkat</a>
      </nav>
    </header>

    <main>
      <h1>Galeri Bakpia.id</h1>
      
      <section aria-labelledby="media-title">
        <h2 id="media-title">Media Usaha</h2>
        <div class="gallery-list">
         
          <figure class="media-card">
            <img 
              src="img/Bakpia Keju.jpg" 
              srcset="img/Bakpia Keju.jpg 480w, img/Bakpia Keju.jpg 800w"
              sizes="(max-width: 600px) 480px, 800px"
              alt="Bakpia Keju Premium dengan taburan keju melimpah" 
            />
            <figcaption>Bakpia Keju Premium, perpaduan manis dan gurih dalam satu gigitan.</figcaption>
          </figure>

          <figure class="media-card">
            <img src="img/Bakpia Kacang Hijau.jpg" alt="Bakpia varian keju dan kacang hijau" />
            <figcaption>Proses pemanggangan manual menjadi bagian dari cerita produk.</figcaption>
          </figure>

        </div>
      </section>

      <section aria-labelledby="audio-title">
        <h2 id="audio-title">Nada Penanda Kedai</h2>
        <p id="audio-note">Nada uji singkat memastikan elemen audio dan kontrol browser berjalan dengan baik.</p>
        <audio controls aria-describedby="audio-note" src="audio/M..mp3">
        </audio>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Bakpia.id — Yogyakarta</p>
    </footer>
    
    <script src="js/script.js"></script>
  </body>
</html>
